<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZenStudy - Calendar</title>
<link rel="stylesheet" href="{{ url_for('static', filename='login/home.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='login/calendar.css') }}">
</head>
<body>

<div class="overlay" id="overlay"></div>

<button id="menu-btn" onclick="toggleSidebar()">☰ Menu</button>

<div id="sidebar" class="sidebar">
<a href="javascript:void(0)" class="close-btn" onclick="toggleSidebar()">×</a>
<h2>Menu</h2>
<a href="{{ url_for('auth.study') }}">📖 Study</a>
<a href="{{ url_for('auth.calendar') }}">📅 Calendar</a>
<a href="{{ url_for('auth.schedule') }}">⏰ Schedule</a>
<a href="{{ url_for('auth.todo_list_page') }}">✅ To Do List</a>
<a href="{{ url_for('auth.notes_page') }}">📝 Notes</a>
<a href="{{ url_for('auth.logout') }}" class="sidebar-secondary">Log Out</a>
<a href="{{ url_for('auth.settings') }}" class="sidebar-secondary">⚙️ Settings</a>
</div>

<div id="cal-page">

  <div class="cal-header">
    <button id="cal-prev" class="cal-nav-btn" aria-label="Previous month">‹</button>
    <h1 id="cal-title">September 2026</h1>
    <button id="cal-next" class="cal-nav-btn" aria-label="Next month">›</button>
    <button id="cal-today-btn" class="cal-today-btn">Today</button>
  </div>

  <div class="cal-weekdays">
    <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
  </div>

  <div class="cal-grid" id="cal-grid">
    <!-- Date cells are generated by calendar.js -->
  </div>

</div>

<!-- Add event modal -->
<div class="cal-modal-overlay" id="cal-modal-overlay">
  <div class="cal-modal">
    <div class="cal-modal-head">
      <h3 id="cal-modal-date">4 September 2026</h3>
      <button class="close-btn" id="cal-modal-close" type="button">×</button>
    </div>

    <ul class="cal-event-list" id="cal-event-list"></ul>

    <form id="cal-event-form">
      <label class="cal-field">
        <span>Time <em>(required)</em></span>
        <input type="time" id="cal-event-time" required>
      </label>
      <label class="cal-field">
        <span>Event</span>
        <input type="text" id="cal-event-text" placeholder="Example: Do Calculus assignment" required>
      </label>
      <button type="submit" class="cal-add-btn">+ Add event</button>
    </form>
  </div>
</div>

<nav class="bottom-nav">
<a href="{{ url_for('auth.home') }}" class="nav-item"><span class="icon">🏠</span>Home</a>
<a href="{{ url_for('auth.global_chat') }}" class="nav-item"><span class="icon">💬</span>Post</a>
<a href="{{ url_for('auth.challenge') }}" class="nav-item"><span class="icon">🏆</span>Challenge</a>
<a href="{{ url_for('auth.profile') }}" class="nav-item"><span class="icon">👤</span>Profile</a>
</nav>

<script src="{{ url_for('static', filename='js/home.js') }}"></script>
<script src="{{ url_for('static', filename='js/calendar.js') }}"></script>
</body>
</html>
